<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countertop Design Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>🪨 Countertop Design Studio</h1>
            </div>
            <div class="header-actions">
                <button id="newProject" class="btn btn-secondary">New Project</button>
                <button id="exportPNG" class="btn btn-primary">Export PNG</button>
                <button id="saveDesign" class="btn btn-primary">Save Design</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar - Tools & Materials -->
            <aside class="sidebar">
                <div class="tool-section">
                    <h3>Templates</h3>
                    <div class="templates">
                        <button class="template-btn" data-size="kitchen">Kitchen (25" x 96")</button>
                        <button class="template-btn" data-size="bathroom">Bathroom (22" x 60")</button>
                        <button class="template-btn" data-size="island">Island (36" x 72")</button>
                        <button class="template-btn" data-size="custom">Custom Size</button>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Materials</h3>
                    <div class="materials">
                        <div class="material-item" data-material="granite-black">
                            <div class="material-swatch" style="background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);"></div>
                            <span>Black Granite</span>
                        </div>
                        <div class="material-item" data-material="granite-white">
                            <div class="material-swatch" style="background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);"></div>
                            <span>White Granite</span>
                        </div>
                        <div class="material-item" data-material="marble-carrara">
                            <div class="material-swatch" style="background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);"></div>
                            <span>Carrara Marble</span>
                        </div>
                        <div class="material-item" data-material="quartz-calacatta">
                            <div class="material-swatch" style="background: linear-gradient(135deg, #fafafa 0%, #ececec 100%);"></div>
                            <span>Calacatta Quartz</span>
                        </div>
                        <div class="material-item" data-material="granite-brown">
                            <div class="material-swatch" style="background: linear-gradient(135deg, #8b6f47 0%, #654321 100%);"></div>
                            <span>Brown Granite</span>
                        </div>
                        <div class="material-item" data-material="quartz-gray">
                            <div class="material-swatch" style="background: linear-gradient(135deg, #9e9e9e 0%, #757575 100%);"></div>
                            <span>Gray Quartz</span>
                        </div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Tools</h3>
                    <div class="tools">
                        <button class="tool-btn active" data-tool="select">
                            <span>📌</span> Select
                        </button>
                        <button class="tool-btn" data-tool="text">
                            <span>📝</span> Text
                        </button>
                        <button class="tool-btn" data-tool="shape">
                            <span>⬜</span> Shape
                        </button>
                        <button class="tool-btn" data-tool="measure">
                            <span>📏</span> Measure
                        </button>
                        <button class="tool-btn" data-tool="note">
                            <span>📋</span> Note
                        </button>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Properties</h3>
                    <div class="properties">
                        <div class="property-group">
                            <label>Width (inches)</label>
                            <input type="number" id="canvasWidth" value="96" min="1">
                        </div>
                        <div class="property-group">
                            <label>Depth (inches)</label>
                            <input type="number" id="canvasDepth" value="25" min="1">
                        </div>
                        <div class="property-group">
                            <label>Thickness (inches)</label>
                            <select id="thickness">
                                <option value="0.75">3/4"</option>
                                <option value="1.25" selected>1 1/4"</option>
                                <option value="2">2"</option>
                                <option value="3">3"</option>
                            </select>
                        </div>
                        <button id="applyDimensions" class="btn btn-block">Apply Dimensions</button>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>Elements</h3>
                    <div id="elementsList" class="elements-list">
                        <!-- Elements will be dynamically added here -->
                    </div>
                </div>
            </aside>

            <!-- Canvas Area -->
            <main class="canvas-area">
                <div class="canvas-toolbar">
                    <div class="canvas-info">
                        <span id="canvasInfo">96" × 25" Kitchen Countertop</span>
                    </div>
                </div>
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="mainCanvas"></canvas>
                </div>
            </main>

            <!-- Properties Panel -->
            <aside class="properties-panel">
                <h3>Object Properties</h3>
                <div id="objectProperties" class="object-properties">
                    <p class="no-selection">Select an object to edit properties</p>
                </div>
            </aside>
        </div>
    </div>

    <!-- Modal for Custom Size -->
    <div id="customSizeModal" class="modal">
        <div class="modal-content">
            <h2>Custom Countertop Size</h2>
            <div class="modal-body">
                <div class="property-group">
                    <label>Width (inches)</label>
                    <input type="number" id="customWidth" value="96" min="1">
                </div>
                <div class="property-group">
                    <label>Depth (inches)</label>
                    <input type="number" id="customDepth" value="25" min="1">
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelCustomSize" class="btn btn-secondary">Cancel</button>
                <button id="applyCustomSize" class="btn btn-primary">Apply</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
